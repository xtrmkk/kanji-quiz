<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>社会テスト</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Mincho ProN','Yu Mincho','MS Mincho',serif;color:#111;
  background:
    radial-gradient(760px 420px at 12% -8%, #eef1ff 0%, transparent 60%),
    radial-gradient(760px 420px at 100% 0%, #eafbf3 0%, transparent 55%),
    #f2f4f8;
  min-height:100vh}

/* ── 操作画面 ── */
.ctrl{max-width:640px;margin:0 auto;padding:36px 18px 48px}
.app-badge{display:block;width:max-content;margin:0 auto 12px;font-size:11px;font-weight:700;
  letter-spacing:.08em;color:#3f52c4;background:#eeecff;padding:5px 13px;border-radius:99px}
.app-title{font-size:23px;font-weight:800;letter-spacing:-.01em;color:#1a1d29;text-align:center;margin-bottom:4px}
.app-sub{font-size:13px;color:#6b7280;text-align:center;margin-bottom:24px}
.card{background:#fff;border-radius:16px;padding:20px;
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 20px rgba(16,24,40,.05);
  border:1px solid #eceef2;margin-bottom:14px}
.card-h{font-size:13px;font-weight:bold;color:#4a5568;margin-bottom:12px;
  display:flex;align-items:center;gap:6px}
.card-h::before{content:'';width:4px;height:13px;border-radius:2px;background:#5a67d8}

/* 範囲ボタン（理科テストと同じ ftag スタイル） */
.frow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:9px}
.frow:last-child{margin-bottom:0}
.flabel{font-size:12px;color:#8a94a6;min-width:34px}
.ftag{padding:5px 12px;border:1px solid #dde1e8;border-radius:99px;font-size:12px;cursor:pointer;
      background:#fff;color:#5c6270;font-family:inherit;transition:all .13s ease}
.ftag:hover{border-color:#b6bce8;color:#3f52c4}
.ftag.on{background:#5a67d8;color:#fff;font-weight:600;border-color:#5a67d8;
  box-shadow:0 2px 6px rgba(90,103,216,.3)}
.ftag.era{font-weight:600}
.ftag.all{border-color:#c7cbd4;color:#4a5568}
.ftag.all.on{background:#232637;color:#fff;border-color:#232637;box-shadow:0 2px 6px rgba(35,38,55,.25)}

.row{display:flex;align-items:center;gap:12px}
label{font-size:14px;color:#4a5568;white-space:nowrap;min-width:66px;text-align:left}
input[type=number]{flex:1;padding:11px 13px;border:1.5px solid #e2e8f0;border-radius:10px;
                   font-size:17px;font-family:inherit;transition:border-color .13s ease}
input[type=number]:focus{outline:none;border-color:#8b9ae0}
.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:#4a5568}
.chk input{width:18px;height:18px;accent-color:#5a67d8}
.pool{font-size:12px;color:#718096;margin-top:12px}
.pool b{color:#2c3f8f;font-size:14px}
.btn{width:100%;padding:16px;background:linear-gradient(135deg,#6a72e8,#4c51bf);color:#fff;
     border:none;border-radius:14px;font-size:18px;font-weight:700;font-family:inherit;
     cursor:pointer;transition:filter .15s ease,transform .1s ease,box-shadow .15s ease;
     box-shadow:0 6px 16px rgba(76,81,191,.28)}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:scale(.99)}
.btn:disabled{background:#c9cee8;box-shadow:none;cursor:not-allowed}
.info{font-size:12px;color:#a0aec0;margin-top:14px;line-height:1.7;text-align:center}

/* 出題順：セグメント切り替え */
.seg{display:inline-flex;background:#eef0f5;border-radius:99px;padding:3px;gap:2px}
.seg-btn{padding:5px 14px;border:none;border-radius:99px;font-size:12px;cursor:pointer;
  background:transparent;color:#6b7280;font-family:inherit;font-weight:500;transition:all .13s ease}
.seg-btn.on{background:#5a67d8;color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(90,103,216,.3)}

/* ── テストシート ── */
#sheet{display:none;background:#fff;padding:14px 16px 20px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-end;
         border-bottom:2px solid #111;padding-bottom:5px;margin-bottom:9px}
.sh-title{font-size:15px;font-weight:bold}
.sh-meta{font-size:10.5px;letter-spacing:.02em}

.qcols{column-count:2;column-gap:9mm;column-rule:1px solid #ddd}
@media (max-width:640px){.qcols{column-count:1}}

.q,.qgroup{break-inside:avoid;page-break-inside:avoid;-webkit-column-break-inside:avoid;
   display:inline-block;width:100%}
.q{padding:6px 0 8px;border-bottom:1px dotted #c8c8c8;margin-bottom:2px}
/* 位置参照のある問題どうしは1つの塊にして列またぎを防ぐ（「上の地図」が成立する） */
.qgroup>.q:not(:last-child){border-bottom:1px dotted #e8e8e8}

.q-body{font-size:9.4px;line-height:1.62;text-align:justify}
.q-num{font-weight:bold;font-size:9.6px;margin-right:.4em}

.box{border:1px dotted #999;padding:4px 6px;margin:4px 0;line-height:1.62}
.note{font-size:8.4px;color:#666;margin-top:2px}
/* 史料の引用ブロック */
.shiryo{border:1px solid #444;padding:5px 7px;margin:3px 0 5px;line-height:1.7;
        background:#fbfbfb;text-indent:1em}
.shiryo b{font-weight:bold}
.era{font-size:8.6px;color:#555;margin-left:.4em}

/* 図まわり ── 文字と重ならないよう余白を確保 */
.fig{margin:8px 0 7px;text-align:center;clear:both}
.fig img{max-width:100%;height:auto;display:inline-block}
.fig-r{float:right;margin:2px 0 8px 11px;text-align:center;max-width:40%}
.fig-r img{max-width:100%;height:auto;display:block}

.ans{margin-top:8px;padding-top:2px;display:flex;flex-wrap:wrap;gap:5px 12px;clear:both}
.ai{font-size:9px;display:flex;align-items:flex-end;gap:3px;white-space:nowrap}
.al{display:inline-block;min-width:86px;border-bottom:1px solid #333;height:13px;
    text-align:center;font-size:9px;line-height:13px}
.al.show{color:#c00}

.sheet-btns{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.pbtn,.bbtn,.abtn{padding:11px 24px;color:#fff;border:none;border-radius:10px;
      font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
      transition:filter .15s ease,transform .1s ease}
.pbtn:hover,.bbtn:hover,.abtn:hover{filter:brightness(1.07)}
.pbtn:active,.bbtn:active,.abtn:active{transform:scale(.97)}
.pbtn{background:#48bb78}
.bbtn{background:#718096}
.abtn{background:#dd6b20}
.abtn.on{background:#9c4221}
.ordnote{font-size:11px;color:#a0aec0;margin-left:2px}

@media print{
  .ctrl,.sheet-btns{display:none!important}
  #sheet{display:block!important;padding:0}
  body{background:#fff}
  @page{size:A4;margin:11mm 9mm}
  .qcols{column-count:2}
  .al.show{color:#000}
}
</style>
</head>
<body>

<div class="ctrl" id="ctrl">
  <span class="app-badge">SOCIAL STUDIES</span>
  <div class="app-title">社会テストジェネレーター</div>
  <div class="app-sub">地理・歴史（古代〜現代）・公民・重要史料　全<span id="totalQ"></span>問</div>

  <div class="card">
    <div class="card-h">出題範囲</div>
    <div id="tags"></div>
    <div class="pool">選択中：<b id="poolN">0</b> 問</div>
  </div>

  <div class="card">
    <div class="row">
      <label>問題数</label>
      <input type="number" id="cnt" value="15" min="1" max="300">
    </div>
    <div class="frow" style="margin-top:13px">
      <span class="flabel">順番</span>
      <div class="seg" id="ordSeg">
        <button class="seg-btn on" data-order="1" onclick="setOrder(true)">番号順</button>
        <button class="seg-btn" data-order="0" onclick="setOrder(false)">ランダム</button>
      </div>
      <span class="ordnote" id="ordNote">小さい番号から順に並べます</span>
    </div>
    <div class="chk">
      <input type="checkbox" id="withans">
      <label for="withans" style="min-width:auto;cursor:pointer">解答を表示した状態で作成する</label>
    </div>
  </div>

  <button class="btn" id="genBtn" onclick="generate()">テストを作成する</button>
  <div class="info">※ 図のある問題は原本の図・写真つきで出ます</div>
</div>

<div id="sheet">
  <div class="sh-head">
    <span class="sh-title" id="shTitle">社会テスト</span>
    <span class="sh-meta">組＿＿　番＿＿　名前＿＿＿＿＿＿＿＿　点＿＿＿</span>
  </div>
  <div class="qcols" id="qc"></div>
  <div class="sheet-btns">
    <button class="pbtn" onclick="window.print()">印刷する</button>
    <button class="bbtn" onclick="back()">戻る</button>
    <button class="abtn" id="ansBtn" onclick="toggleAns()">解答を表示</button>
  </div>
</div>

<script>
/*__QDATA__*/

const CIRC='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
const sel=new Set();     // 選択中の範囲キー
let shuffleOn=false;     // 出題順をシャッフルするか（デフォルトは番号順）
let ansShown=false;      // 解答を表示中か

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function inRange(q,r){return q.n>=r[0]&&q.n<=r[1];}

/* ── 範囲ボタンの構築 ── */
function buildTags(){
  const host=document.getElementById('tags');
  document.getElementById('totalQ').textContent=Q.length;

  const all=document.createElement('div'); all.className='frow';
  all.innerHTML='<span class="flabel"></span>';
  const ab=document.createElement('button');
  ab.className='ftag all'; ab.textContent='全範囲'; ab.dataset.k='all';
  ab.onclick=()=>{sel.clear(); sel.add('all'); render();};
  all.appendChild(ab); host.appendChild(all);

  RANGES.forEach(era=>{
    const row=document.createElement('div'); row.className='frow';
    const lb=document.createElement('span'); lb.className='flabel'; lb.textContent=era.label;
    row.appendChild(lb);

    const eb=document.createElement('button');
    eb.className='ftag era'; eb.textContent=era.name; eb.dataset.k=era.key;
    eb.onclick=()=>toggle(era.key); row.appendChild(eb);

    era.subs.forEach(s=>{
      const b=document.createElement('button');
      b.className='ftag'; b.textContent=s.name; b.dataset.k=s.key;
      b.onclick=()=>toggle(s.key); row.appendChild(b);
    });
    host.appendChild(row);
  });
  sel.add('all'); render();
}

function toggle(k){
  sel.delete('all');
  if(sel.has(k)) sel.delete(k); else sel.add(k);
  if(sel.size===0) sel.add('all');
  render();
}

/* 選択中のキーから出題対象の問題を求める */
function pool(){
  if(sel.has('all')) return Q.slice();
  const rs=[];
  RANGES.forEach(era=>{
    if(sel.has(era.key)) rs.push(era.range);
    era.subs.forEach(s=>{ if(sel.has(s.key)) rs.push(s.range); });
  });
  return Q.filter(q=>rs.some(r=>inRange(q,r)));
}

function render(){
  document.querySelectorAll('.ftag').forEach(b=>{
    b.classList.toggle('on', sel.has(b.dataset.k));
  });
  const n=pool().length;
  document.getElementById('poolN').textContent=n;
  const cnt=document.getElementById('cnt');
  cnt.max=n;
  if(+cnt.value>n) cnt.value=n;
  document.getElementById('genBtn').disabled = n<1;
}

/* 選択範囲から見出しを作る */
function titleOf(){
  if(sel.has('all')) return '社会テスト　全範囲（地理・歴史・公民）';
  const names=[];
  RANGES.forEach(era=>{
    if(sel.has(era.key)){ names.push(era.label); return; }
    era.subs.forEach(s=>{ if(sel.has(s.key)) names.push(s.name); });
  });
  return '社会テスト　'+names.join('・');
}

/* ── テスト生成 ── */
function generate(){
  const P=pool();
  if(!P.length) return;
  const cnt=Math.min(P.length,Math.max(1,parseInt(document.getElementById('cnt').value)||15));
  const showAns=document.getElementById('withans').checked;

  let list=shuffle(P.slice()).slice(0,cnt);
  const nums=new Set(list.map(q=>q.n));

  // 他問を参照する問題：参照先が出題されていれば原文のまま、
  // 出題されていなければ改変文（talt）と代替の図（figalt）に差し替える
  list=list.map(q=>{
    if(!q.dep) return q;
    if(nums.has(q.dep)) return Object.assign({},q,{_pairWith:q.dep});
    return Object.assign({},q,{
      t:q.talt||q.t,
      fig:q.figalt||q.fig,
      figpos:q.figalt?(q.figposalt||null):q.figpos});
  });

  // 番号順に並べる指定なら、抽選後に番号順へ並べ替える
  if(!shuffleOn) list.sort((a,b)=> a.n-b.n || (a.sub||'').localeCompare(b.sub||''));

  // 「上の地図」など位置に依存する参照は、参照先と1つの塊にまとめて列またぎを防ぐ
  // groups: 参照先の番号 -> 依存side の問題
  const groups=new Map();
  list.forEach(q=>{ if(q._pairWith && q.group) groups.set(q._pairWith,q); });
  // 依存sideは必ずペアの中で描画するので、単独では出さない（listの順序に依存しない）
  const inGroup=new Set([...groups.values()]);

  // 番号参照（「434の人物」など）は、参照先の直後に続けて並べる
  list=orderAfterDep(list, inGroup);

  const c=document.getElementById('qc');
  c.innerHTML='';

  list.forEach(q=>{
    if(inGroup.has(q)) return;
    const partner=groups.get(q.n);
    if(partner){
      const g=document.createElement('div'); g.className='qgroup';
      g.appendChild(qEl(q,showAns));       // 参照先（地図を持つ側）を上に
      g.appendChild(qEl(partner,showAns)); // 「上の地図」と書かれた側を下に
      c.appendChild(g);
    }else{
      c.appendChild(qEl(q,showAns));
    }
  });

  document.getElementById('shTitle').textContent=titleOf();
  setAns(showAns);                       // 解答ボタンの表示を作成時の状態に合わせる
  document.getElementById('ctrl').style.display='none';
  document.getElementById('sheet').style.display='block';
  window.scrollTo(0,0);
}

/* 参照先が出題されている問題を、参照先の直後に並べ替える。
   同じ問題を参照する問題が複数あるときは番号順に続けて並べる。
   位置参照（inGroup）はペアとして別途まとめて描画するのでここでは動かさない。 */
function orderAfterDep(list, inGroup){
  const byDep=new Map();          // 参照先の番号 -> [依存する問題...]
  list.forEach(q=>{
    if(!q._pairWith || inGroup.has(q)) return;
    if(!byDep.has(q._pairWith)) byDep.set(q._pairWith,[]);
    byDep.get(q._pairWith).push(q);
  });
  if(!byDep.size) return list;

  byDep.forEach(arr=>arr.sort((a,b)=> a.n-b.n || (a.sub||'').localeCompare(b.sub||'')));
  const isChild=new Set();
  byDep.forEach(arr=>arr.forEach(q=>isChild.add(q)));

  const out=[], done=new Set();
  const emit=q=>{
    if(done.has(q)) return;
    done.add(q); out.push(q);
    (byDep.get(q.n)||[]).forEach(emit);   // 参照先の直後に依存問題を続ける
  };
  list.forEach(q=>{ if(!isChild.has(q)) emit(q); });
  list.forEach(emit);                     // 取りこぼし（循環参照）への保険
  return out;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function qEl(q,showAns){
  const labs=q.lab||q.a.map((_,i)=>CIRC[i]);
  const ans=q.a.map((v,i)=>
    `<span class="ai">${labs[i]}<span class="al${showAns?' show':''}" data-a="${esc(v)}">`
    + `${showAns?v:''}</span></span>`
  ).join('');

  let figR='', figB='', figT='';
  if(q.fig&&FIGS[q.fig]){
    const f=FIGS[q.fig];
    const img=`<img src="${f.src}" style="max-height:${f.mh}mm">`;
    if(q.figpos==='right')   figR=`<span class="fig-r">${img}</span>`;
    else if(q.figtop)        figT=`<div class="fig">${img}</div>`;
    else                     figB=`<div class="fig">${img}</div>`;
  }
  const note=q.note?`<div class="note">${q.note}</div>`:'';
  const tail=q.t2?`<div class="q-body" style="margin-top:4px">${q.t2}</div>`:'';

  const num=q.n+(q.sub||'');
  const era=q.era?`<span class="era">［${q.era}］</span>`:'';

  const d=document.createElement('div');
  d.className='q';
  d.innerHTML=figT
            + `<div class="q-body">${figR}<span class="q-num">${num}</span>${era}${q.t}</div>`
            + figB + tail + note
            + `<div class="ans">${ans}</div>`;
  return d;
}

function back(){
  document.getElementById('ctrl').style.display='block';
  document.getElementById('sheet').style.display='none';
}

/* 出題順：番号順 ⇄ ランダム */
function setOrder(orderMode){
  shuffleOn=!orderMode;
  document.querySelectorAll('#ordSeg .seg-btn').forEach(b=>{
    b.classList.toggle('on', (b.dataset.order==='1')===orderMode);
  });
  document.getElementById('ordNote').textContent =
    shuffleOn?'出題順をシャッフルします':'小さい番号から順に並べます';
}

/* 解答の表示 ⇄ 非表示（作り直さずその場で切り替える） */
function toggleAns(){
  setAns(!ansShown);
}

function setAns(on){
  ansShown=on;
  document.querySelectorAll('#qc .al').forEach(e=>{
    e.textContent = on ? (e.dataset.a||'') : '';
    e.classList.toggle('show', on);
  });
  const b=document.getElementById('ansBtn');
  b.textContent = on?'解答を隠す':'解答を表示';
  b.classList.toggle('on', on);
}

setOrder(true);
buildTags();
</script>
</body>
</html>
