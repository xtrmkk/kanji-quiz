<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>理科テストジェネレーター</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Mincho ProN','Yu Mincho','MS Mincho',serif;color:#111;
  background:
    radial-gradient(760px 420px at 12% -8%, #e4f4f6 0%, transparent 60%),
    radial-gradient(760px 420px at 100% 0%, #eafbf3 0%, transparent 55%),
    #f2f4f8;
  min-height:100vh}

/* ── 操作画面 ── */
.ctrl{max-width:700px;margin:0 auto;padding:36px 18px 48px}
.app-badge{display:block;width:max-content;margin:0 auto 12px;font-size:11px;font-weight:700;
  letter-spacing:.08em;color:#0f7c8a;background:#e4f4f6;padding:5px 13px;border-radius:99px}
.app-title{font-size:23px;font-weight:800;letter-spacing:-.01em;color:#1a1d29;text-align:center;margin-bottom:4px}
.app-sub{font-size:13px;color:#6b7280;text-align:center;margin-bottom:24px}
.card{background:#fff;border-radius:16px;padding:20px;
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 20px rgba(16,24,40,.05);
  border:1px solid #eceef2;margin-bottom:14px}
.card-h{font-size:13px;font-weight:bold;color:#4a5568;margin-bottom:12px;
  display:flex;align-items:center;gap:6px}
.card-h::before{content:'';width:4px;height:13px;border-radius:2px;background:#18a2ae}

.frow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:9px}
.frow:last-child{margin-bottom:0}
.flabel{font-size:12px;color:#8a94a6;min-width:44px}
.ftag{padding:5px 12px;border:1px solid #dde1e8;border-radius:99px;font-size:12px;cursor:pointer;
      background:#fff;color:#5c6270;font-family:inherit;transition:all .13s ease}
.ftag:hover{border-color:#9fd4d9;color:#0f7c8a}
.ftag.on{background:#18a2ae;color:#fff;font-weight:600;border-color:#18a2ae;
  box-shadow:0 2px 6px rgba(24,162,174,.3)}
.ftag.era{font-weight:600}
.ftag.all{border-color:#c7cbd4;color:#4a5568}
.ftag.all.on{background:#232637;color:#fff;border-color:#232637;box-shadow:0 2px 6px rgba(35,38,55,.25)}

.row{display:flex;align-items:center;gap:12px}
label{font-size:14px;color:#4a5568;white-space:nowrap;min-width:66px;text-align:left}
input[type=number]{flex:1;padding:11px 13px;border:1.5px solid #e2e8f0;border-radius:10px;
                   font-size:17px;font-family:inherit;transition:border-color .13s ease}
input[type=number]:focus{outline:none;border-color:#7fc7cd}
.pool{font-size:12px;color:#718096;margin-top:12px}
.pool b{color:#0f7c8a;font-size:14px}
.btn{width:100%;padding:16px;background:linear-gradient(135deg,#22b3bf,#0f7c8a);color:#fff;
     border:none;border-radius:14px;font-size:18px;font-weight:700;font-family:inherit;
     cursor:pointer;transition:filter .15s ease,transform .1s ease,box-shadow .15s ease;
     box-shadow:0 6px 16px rgba(15,124,138,.28)}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:scale(.99)}
.btn:disabled{background:#b9dee1;box-shadow:none;cursor:not-allowed}
.info{font-size:12px;color:#a0aec0;margin-top:14px;line-height:1.7;text-align:center}
.ordnote{font-size:11px;color:#a0aec0;margin-left:2px}

/* 出題順：セグメント切り替え */
.seg{display:inline-flex;background:#eef0f5;border-radius:99px;padding:3px;gap:2px}
.seg-btn{padding:5px 14px;border:none;border-radius:99px;font-size:12px;cursor:pointer;
  background:transparent;color:#6b7280;font-family:inherit;font-weight:500;transition:all .13s ease}
.seg-btn.on{background:#18a2ae;color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(24,162,174,.3)}

/* ── テストシート ── */
#sheet{display:none;background:#fff;padding:14px 16px 20px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-end;
         border-bottom:2px solid #111;padding-bottom:5px;margin-bottom:9px}
.sh-title{font-size:15px;font-weight:bold}
.sh-meta{font-size:10.5px;letter-spacing:.02em}

.qcols{column-count:2;column-gap:9mm;column-rule:1px solid #ddd}
@media (max-width:640px){.qcols{column-count:1}}

.q{break-inside:avoid;page-break-inside:avoid;-webkit-column-break-inside:avoid;
   display:inline-block;width:100%;
   padding:6px 0 8px;border-bottom:1px dotted #c8c8c8;margin-bottom:2px}

.q-head{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.badge{font-size:8.4px;padding:1px 6px;border-radius:4px;white-space:nowrap}
.q-num{font-weight:bold;font-size:9.6px}
.q-body{font-size:9.4px;line-height:1.62;text-align:justify}

.ctx{border:1px dotted #999;padding:4px 6px;margin:4px 0;line-height:1.6;font-size:8.8px;color:#333}

/* 図まわり ── 文字と重ならないよう余白を確保 */
.fig{margin:6px 0;text-align:center;clear:both}
.fig img{max-width:100%;height:auto;display:inline-block}
.fig-r{float:right;margin:2px 0 7px 10px;text-align:center;max-width:42%}
.fig-r img{max-width:100%;height:auto;display:block}

/* 小問＋解答欄（旧版のようにラベルを二重に出さない） */
.subs{margin-top:5px;clear:both}
.sub{font-size:9px;line-height:1.75;margin-bottom:1px}
.sub-l{display:inline-block;min-width:70px;border-bottom:1px solid #333;height:11px;
       margin-left:5px;vertical-align:baseline;text-align:center;font-size:9px;line-height:11px}
.one-l{display:block;border-bottom:1px solid #333;height:13px;margin-top:7px;clear:both;
       text-align:center;font-size:9px;line-height:13px}
.sub-l.show,.one-l.show{color:#c00}
.noans{font-size:8px;color:#bbb;margin-left:4px}

.sheet-btns{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.pbtn,.bbtn,.abtn{padding:11px 24px;color:#fff;border:none;border-radius:10px;
      font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
      transition:filter .15s ease,transform .1s ease}
.pbtn:hover,.bbtn:hover,.abtn:hover{filter:brightness(1.07)}
.pbtn:active,.bbtn:active,.abtn:active{transform:scale(.97)}
.pbtn{background:#48bb78}
.bbtn{background:#718096}
.abtn{background:#dd6b20}
.abtn.on{background:#9c4221}

@media print{
  .ctrl,.sheet-btns{display:none!important}
  #sheet{display:block!important;padding:0}
  body{background:#fff}
  @page{size:A4;margin:11mm 9mm}
  .qcols{column-count:2}
  .badge{border:1px solid #bbb}
  .sub-l.show,.one-l.show{color:#000}
}
</style>
</head>
<body>

<div class="ctrl" id="ctrl">
  <span class="app-badge">SCIENCE</span>
  <div class="app-title">理科テストジェネレーター</div>
  <div class="app-sub">化学・地学・物理・生物＋実験器具・環境・発展　全<span id="totalQ"></span>問</div>

  <div class="card">
    <div class="card-h">出題範囲</div>
    <div id="tags"></div>
    <div class="pool">選択中：<b id="poolN">0</b> 問</div>
  </div>

  <div class="card">
    <div class="row">
      <label>問題数</label>
      <input type="number" id="cnt" value="20" min="1" max="720">
    </div>
    <div class="frow" style="margin-top:13px">
      <span class="flabel">順番</span>
      <div class="seg" id="ordSeg">
        <button class="seg-btn on" data-order="1" onclick="setOrder(true)">番号順</button>
        <button class="seg-btn" data-order="0" onclick="setOrder(false)">ランダム</button>
      </div>
      <span class="ordnote" id="ordNote">小さい番号から順に並べます</span>
    </div>
    <div class="chk" style="margin-top:12px;display:flex;align-items:center;gap:8px;font-size:14px;color:#4a5568">
      <input type="checkbox" id="withans" style="width:18px;height:18px;accent-color:#18a2ae">
      <label for="withans" style="min-width:auto;cursor:pointer">解答を表示した状態で作成する</label>
    </div>
  </div>

  <button class="btn" id="genBtn" onclick="generate()">テストを作成する</button>
  <div class="info">※ 図のある問題は図つきで出ます<br>※ 解答は化学分野（第1〜3節）のみ収録しています</div>
</div>

<div id="sheet">
  <div class="sh-head">
    <span class="sh-title" id="shTitle">理科テスト</span>
    <span class="sh-meta">組＿＿　番＿＿　名前＿＿＿＿＿＿＿＿　点＿＿＿</span>
  </div>
  <div class="qcols" id="qc"></div>
  <div class="sheet-btns">
    <button class="pbtn" onclick="window.print()">印刷する</button>
    <button class="bbtn" onclick="back()">戻る</button>
    <button class="abtn" id="ansBtn" onclick="toggleAns()">解答を表示</button>
  </div>
</div>

<script>
/*__QDATA__*/

const sel=new Set();     // 選択中の範囲キー
let shuffleOn=false;     // 出題順をシャッフルするか（デフォルトは番号順）
let ansShown=false;      // 解答を表示中か

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ── 範囲ボタンの構築 ── */
function buildTags(){
  const host=document.getElementById('tags');
  document.getElementById('totalQ').textContent=Q.length;

  const all=document.createElement('div'); all.className='frow';
  all.innerHTML='<span class="flabel"></span>';
  const ab=document.createElement('button');
  ab.className='ftag all'; ab.textContent='全範囲'; ab.dataset.k='all';
  ab.onclick=()=>{sel.clear(); sel.add('all'); render();};
  all.appendChild(ab); host.appendChild(all);

  GROUPS.forEach(g=>{
    const row=document.createElement('div'); row.className='frow';
    const lb=document.createElement('span'); lb.className='flabel'; lb.textContent=g.label;
    row.appendChild(lb);

    const eb=document.createElement('button');
    eb.className='ftag era'; eb.textContent=g.label+'すべて'; eb.dataset.k=g.key;
    eb.onclick=()=>toggle(g.key); row.appendChild(eb);

    g.secs.forEach(s=>{
      const b=document.createElement('button');
      b.className='ftag'; b.textContent=SEC[s][0]+' '+SEC[s][1]; b.dataset.k=s;
      b.onclick=()=>toggle(s); row.appendChild(b);
    });
    host.appendChild(row);
  });
  sel.add('all'); render();
}

function toggle(k){
  sel.delete('all');
  if(sel.has(k)) sel.delete(k); else sel.add(k);
  if(sel.size===0) sel.add('all');
  render();
}

/* 選択中のキーから出題対象の節を求める */
function activeSecs(){
  const out=new Set();
  GROUPS.forEach(g=>{
    if(sel.has(g.key)) g.secs.forEach(s=>out.add(s));
    g.secs.forEach(s=>{ if(sel.has(s)) out.add(s); });
  });
  return out;
}

function pool(){
  if(sel.has('all')) return Q.slice();
  const secs=activeSecs();
  return Q.filter(q=>secs.has(q.s));
}

function render(){
  document.querySelectorAll('.ftag').forEach(b=>{
    b.classList.toggle('on', sel.has(b.dataset.k));
  });
  const n=pool().length;
  document.getElementById('poolN').textContent=n;
  const cnt=document.getElementById('cnt');
  cnt.max=n;
  if(+cnt.value>n) cnt.value=n;
  document.getElementById('genBtn').disabled = n<1;
}

function titleOf(){
  if(sel.has('all')) return '理科テスト（全範囲）';
  const names=[];
  GROUPS.forEach(g=>{
    if(sel.has(g.key)){ names.push(g.label); return; }
    g.secs.forEach(s=>{ if(sel.has(s)) names.push(SEC[s][0]); });
  });
  return '理科テスト　'+names.join('・');
}

/* 出題順：番号順 ⇄ ランダム */
function setOrder(orderMode){
  shuffleOn=!orderMode;
  document.querySelectorAll('#ordSeg .seg-btn').forEach(b=>{
    b.classList.toggle('on', (b.dataset.order==='1')===orderMode);
  });
  document.getElementById('ordNote').textContent =
    shuffleOn?'出題順をシャッフルします':'小さい番号から順に並べます';
}

/* ── テスト生成 ── */
function generate(){
  const P=pool();
  if(!P.length) return;
  const cnt=Math.min(P.length,Math.max(1,parseInt(document.getElementById('cnt').value)||20));
  const showAns=document.getElementById('withans').checked;

  let list=shuffle(P.slice()).slice(0,cnt);
  if(!shuffleOn) list.sort((a,b)=>a.id-b.id);

  const c=document.getElementById('qc');
  c.innerHTML='';
  list.forEach((q,i)=>c.appendChild(qEl(q,i)));

  document.getElementById('shTitle').textContent=titleOf();
  setAns(showAns);
  document.getElementById('ctrl').style.display='none';
  document.getElementById('sheet').style.display='block';
  window.scrollTo(0,0);
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* 解答の表示 ⇄ 非表示（作り直さずその場で切り替える） */
function toggleAns(){ setAns(!ansShown); }

function setAns(on){
  ansShown=on;
  document.querySelectorAll('#qc .sub-l, #qc .one-l').forEach(e=>{
    e.textContent = on ? (e.dataset.a||'') : '';
    e.classList.toggle('show', on);
  });
  const b=document.getElementById('ansBtn');
  b.textContent = on?'解答を隠す':'解答を表示';
  b.classList.toggle('on', on);
}

/* 図の出し方を決める。
   幅広指定の図と、記号（A〜Iなど）を多く問う図は本文の下に大きく出す。
   それ以外は右に回り込ませて縦の場所を節約する。 */
function figHtml(key,q){
  const f=FIGS[key]; if(!f) return ['',''];
  const manyRefs = (q.sub||[]).length>=5;
  const block = f.wide || manyRefs;
  const mh = block ? Math.max(f.mh,42) : f.mh;
  const img=`<img src="${f.src}" style="max-height:${mh}mm">`;
  return block ? ['', `<div class="fig">${img}</div>`]
               : [`<span class="fig-r">${img}</span>`, ''];
}

function qEl(q,i){
  const sec=SEC[q.s];
  const badge=`<span class="badge" style="background:${sec[2]};color:${sec[3]}">${sec[0]}</span>`;

  let figR='', figB='';
  if(q.fig){ const [r,b]=figHtml(q.fig,q); figR+=r; figB+=b; }
  if(q.ref_fig){
    const [r,b]=figHtml(q.ref_fig,q);
    const note='<div class="ctx" style="border-style:solid;border-color:#ddd">※参照図（関連問題より）</div>';
    if(b) figB+=note+b; else figR+=r;
  }

  const ctx=q.ctx?`<div class="ctx">${q.ctx}</div>`:'';

  // 小問は文と解答欄を1行にまとめる（旧版のラベル二重表示を解消）
  // 解答データがあれば sub-l / one-l に data-a として埋め込み、あとで表示/非表示を切り替える
  const a=q.a||[];
  // 解答が小問ごとに1つずつ揃っているときだけ各行に対応させる。
  // それ以外（表形式などをまとめて1本の解答文にした場合）は先頭行にだけ全文を出す。
  const perLine = a.length===((q.sub||[]).length||1);
  let subs='';
  if(q.sub && q.sub.length){
    subs='<div class="subs">'
       + q.sub.map((s,i)=>{
           const v = perLine ? a[i] : (i===0 ? (a[0]||'') : '');
           return `<div class="sub">${s}<span class="sub-l" data-a="${esc(v)}"></span></div>`;
         }).join('')
       + '</div>';
  }else if(!q.fig_table){
    subs=`<span class="one-l" data-a="${esc(a[0]||'')}"></span>`;
  }

  const table=q.fig_table==='evap'?EVAP_TABLE:'';

  const d=document.createElement('div');
  d.className='q';
  d.innerHTML=`<div class="q-head">${badge}<span class="q-num">問${i+1}</span>`
            + `<span style="font-size:8.4px;color:#999">No.${q.id}</span></div>`
            + `<div class="q-body">${figR}${q.q}</div>`
            + ctx + figB + table + subs;
  return d;
}

function back(){
  document.getElementById('ctrl').style.display='block';
  document.getElementById('sheet').style.display='none';
}

setOrder(true);
buildTags();
</script>
</body>
</html>
