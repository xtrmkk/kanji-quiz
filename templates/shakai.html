<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>社会テスト（古代）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Mincho ProN','Yu Mincho','MS Mincho',serif;background:#f0f2f5;color:#111}

/* ── 操作画面 ── */
.ctrl{max-width:460px;margin:0 auto;padding:28px 20px;text-align:center}
.app-title{font-size:21px;font-weight:bold;color:#2d3748;margin-bottom:4px}
.app-sub{font-size:13px;color:#718096;margin-bottom:22px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.09);margin-bottom:16px}
.row{display:flex;align-items:center;gap:12px}
label{font-size:14px;color:#4a5568;white-space:nowrap;min-width:66px;text-align:left}
input[type=number]{flex:1;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:17px;font-family:inherit}
.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:#4a5568;justify-content:flex-start}
.chk input{width:18px;height:18px}
.btn{width:100%;padding:16px;background:#5a67d8;color:#fff;border:none;border-radius:12px;font-size:18px;font-family:inherit;cursor:pointer}
.btn:active{background:#4c51bf}
.badge{display:inline-block;background:#ebf4ff;color:#3182ce;border-radius:8px;padding:4px 10px;font-size:12px;margin:3px}
.info{font-size:12px;color:#a0aec0;margin-top:14px;line-height:1.6}

/* ── テストシート ── */
#sheet{display:none;background:#fff;padding:14px 16px 20px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-end;
         border-bottom:2px solid #111;padding-bottom:5px;margin-bottom:9px}
.sh-title{font-size:15px;font-weight:bold}
.sh-meta{font-size:10.5px;letter-spacing:.02em}

.qcols{column-count:2;column-gap:9mm;column-rule:1px solid #ddd}
@media (max-width:640px){.qcols{column-count:1}}

.q{break-inside:avoid;page-break-inside:avoid;-webkit-column-break-inside:avoid;
   display:inline-block;width:100%;
   padding:6px 0 8px;border-bottom:1px dotted #c8c8c8;margin-bottom:2px}
.q-body{font-size:9.4px;line-height:1.62;text-align:justify}
.q-num{font-weight:bold;font-size:9.6px;margin-right:.4em}

/* 本文内の囲み・選択肢 */
.box{border:1px dotted #999;padding:4px 6px;margin:4px 0;line-height:1.62}
.opts{margin-top:3px}
.note{font-size:8.4px;color:#666;margin-top:2px}

/* 図まわり ── 文字と重ならないよう余白を確保 */
.fig{margin:8px 0 7px;text-align:center;clear:both}
.fig img{max-width:100%;height:auto;display:inline-block}
/* 右寄せ図：本文が回り込む。左に余白を取って文字が接しないようにする */
.fig-r{float:right;margin:2px 0 8px 11px;text-align:center;max-width:40%}
.fig-r img{max-width:100%;height:auto;display:block}

/* 解答欄 */
.ans{margin-top:8px;padding-top:2px;display:flex;flex-wrap:wrap;gap:5px 12px;clear:both}
.ai{font-size:9px;display:flex;align-items:flex-end;gap:3px;white-space:nowrap}
.al{display:inline-block;min-width:86px;border-bottom:1px solid #333;height:13px;
    text-align:center;font-size:9px;line-height:13px}
.al.show{color:#c00}

.sheet-btns{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.pbtn{padding:10px 22px;background:#48bb78;color:#fff;border:none;border-radius:8px;font-size:16px;font-family:inherit;cursor:pointer}
.bbtn{padding:10px 22px;background:#718096;color:#fff;border:none;border-radius:8px;font-size:16px;font-family:inherit;cursor:pointer}

@media print{
  .ctrl,.sheet-btns{display:none!important}
  #sheet{display:block!important;padding:0}
  body{background:#fff}
  @page{size:A4;margin:11mm 9mm}
  .qcols{column-count:2}
  .al.show{color:#000}
}
</style>
</head>
<body>

<div class="ctrl" id="ctrl">
  <div class="app-title">社会テストジェネレーター</div>
  <div class="app-sub">歴史：古代（旧石器〜平安時代）　全60問</div>
  <div class="card">
    <div>
      <span class="badge">原文そのまま</span>
      <span class="badge">図・写真つき</span>
      <span class="badge">ランダム出題</span>
    </div>
    <div style="margin-top:16px">
      <div class="row">
        <label>問題数</label>
        <input type="number" id="cnt" value="15" min="3" max="60">
      </div>
      <div class="chk">
        <input type="checkbox" id="withans">
        <label for="withans" style="min-width:auto;cursor:pointer">解答を表示する</label>
      </div>
    </div>
  </div>
  <button class="btn" onclick="generate()">テストを作成する</button>
  <div class="info">※ 毎回ランダムに出題されます<br>※ 図のある問題は原本の図・写真つきで出ます</div>
</div>

<div id="sheet">
  <div class="sh-head">
    <span class="sh-title">社会テスト　歴史：古代（旧石器〜平安時代）</span>
    <span class="sh-meta">組＿＿　番＿＿　名前＿＿＿＿＿＿＿＿　点＿＿＿</span>
  </div>
  <div class="qcols" id="qc"></div>
  <div class="sheet-btns">
    <button class="pbtn" onclick="window.print()">印刷する</button>
    <button class="bbtn" onclick="back()">戻る</button>
  </div>
</div>

<script>
const Q=[{"n": 310, "t": "① 相沢忠洋によって群馬県で発見された旧石器時代（先土器時代）の遺跡を何といいますか。<br>② ①の遺跡から発見された、右の図のような石を打ちくだいてつくられたかんたんな石器を何といいますか。", "a": ["岩宿遺跡", "打製石器"], "fig": "q310", "figpos": "right"}, {"n": 311, "t": "次の文中の（①）〜（④）にふさわしい語句をあとのア〜エから選び、記号で答えなさい。<div class=\"box\">縄文時代になると石器は使いやすいように加工された（①）が使われるようになりました。また、縄目の文様のついた下の図Aのような（②）がつくられ、食料を煮炊きしたり、保存したりするために使われました。人々は狩猟と採集によって食料を得る移住生活をしていましたが、図Bのような（③）をつくって住むこともありました。縄文時代の遺跡からは図Cのような（④）とよばれる素焼きの人形が出土しています。</div><div class=\"opts\">ア 竪穴住居　イ 縄文土器　ウ 磨製石器　エ 土偶</div>", "a": ["ウ", "イ", "ア", "エ"], "fig": "q311"}, {"n": 312, "t": "縄文時代の人々のごみ捨て場の跡を（①）とよびます。明治時代には東京でエドワード＝モースが（②）を発見し、発掘調査が行われました。また、青森県の（③）遺跡は、発掘調査によって縄文時代に定住生活や原始農耕が行われていたことが明らかになり、縄文時代のイメージを変えた遺跡として注目されています。", "a": ["貝塚", "大森貝塚", "三内丸山"]}, {"n": 313, "t": "縄文時代の終わりに大陸から伝わった（①）は、弥生時代になると全国的に広まりました。それとともに、人々は水の得やすい低地に水田をつくり、定住するようになりました。実った稲は図Aのような（②）で刈り取られ、図Bのような（③）の中に保存されました。", "a": ["稲作", "石包丁", "高床倉庫"], "fig": "q313"}, {"n": 314, "t": "次の図は、いずれも弥生時代に使われたものです。①はうす手でじょうぶな赤褐色の土器で、②は青銅器の1つです。それぞれ何といいますか。", "a": ["弥生土器", "銅鐸"], "fig": "q314"}, {"n": 315, "t": "静岡県の（①）遺跡からは、弥生時代の水田の跡やたくさんの木製農具などが発見されました。また、佐賀県の（②）遺跡は、濠と柵に囲まれた弥生時代の大規模な環濠集落跡として知られています。この遺跡からは、首のない人骨も見つかっていることから、この時代には村どうしで争いがあったことがうかがえます。", "a": ["登呂", "吉野ヶ里"]}, {"n": 316, "t": "中国の歴史書『後漢書東夷伝』によると、西暦57年には倭の奴国の王が中国の皇帝より金印を授かったとされています。この金印は福岡県の（　）から出土しました。", "a": ["志賀島"], "lab": [""]}, {"n": 317, "t": "中国の歴史書『魏志倭人伝』によると、239年には（①）の女王である（②）が魏に使いを送り金印を授けられたとされています。『魏志倭人伝』には（①）までの道のりや、（①）に住む人々の生活の様子が記されています。", "a": ["邪馬台国", "卑弥呼"]}, {"n": 318, "t": "3世紀後半ごろから豪族たちが大規模な墓（古墳）をつくるようになりました。<br>① 図Aのような形の古墳を何といいますか。<br>② 日本最大の古墳の名前を答えなさい。<br>③「ワカタケル大王」と記された鉄剣が発見された埼玉県の古墳の名前を答えなさい。<br>④ 古墳の周囲に並べられた図Bのようなものを何といいますか。", "a": ["前方後円墳", "大仙古墳", "稲荷山古墳", "埴輪"], "fig": "q318"}, {"n": 319, "t": "① 古代に大陸や朝鮮半島から日本に移り住み、さまざまな文化や技術を日本に伝えた人々を何といいますか。<br>② 次の（A）〜（D）は①の人々によって伝えられた文化や技術の例です。それぞれに当てはまる語句を答えなさい。<div class=\"box\">（A）…孔子が説いた道徳的な教え。<br>（B）…538年に百済の聖明王から仏像と経典が伝えられた。<br>（C）…古代中国で生まれた文字。日本でも文字として使われた。<br>（D）の製法…登り窯を使って高温で土器を焼く方法。</div>", "a": ["渡来人", "儒教", "仏教", "漢字", "須恵器"], "lab": ["①", "②A", "②B", "②C", "②D"]}, {"n": 320, "t": "4世紀中ごろになると、大和地方の豪族たちが連合してつくった（①）が、九州地方から東北地方の南部までを支配しました。（①）は各地の豪族たちに氏や姓などの地位をあたえて支配し、政治に関するさまざまな仕事を行わせました。この政治制度を（②）といいます。", "a": ["大和政権", "氏姓制度"]}, {"n": 321, "t": "次の文の（①）〜（④）に当てはまる語句を答えなさい。<div class=\"box\">593年に（①）天皇の摂政となった（②）は、（③）の協力を得て、（④）を中心とする国づくりをめざし政治を進めました。</div>", "a": ["推古", "聖徳太子（厩戸皇子）", "蘇我馬子", "天皇"]}, {"n": 322, "t": "聖徳太子（厩戸皇子）は、身分や家柄に関係なく能力のある者が高い位につくことができるようにするため、603年に（①）の制度を定めました。また、役人たちの心構えを示すため、604年に（②）を定めました。", "a": ["冠位十二階", "十七条の憲法"]}, {"n": 323, "t": "聖徳太子は、中国の進んだ文化を取り入れるために、607年に（①）を（②）として中国に送りました。", "a": ["小野妹子", "遣隋使"]}, {"n": 324, "t": "聖徳太子が大和国（奈良県）斑鳩につくった（①）は、現存する世界最古の木造建築物として有名です。この（①）が建てられたころの文化を（②）といいます。", "a": ["法隆寺", "飛鳥文化"]}, {"n": 325, "t": "645年、のちに天智天皇となる（①）は、豪族の（②）と協力して、天皇をしのぐほどの権力を持っていた蘇我氏を倒し、（③）を行いました。", "a": ["中大兄皇子", "中臣鎌足", "大化の改新"]}, {"n": 326, "t": "大化の改新では、土地と人々を国のものとする（①）を原則とし、（②）を定めて人々に（③）を貸しあたえる代わりに、さまざまな税を負担させました。", "a": ["公地公民", "班田収授法", "口分田"]}, {"n": 327, "t": "大化の改新では、全国を国・郡・里に分け、中央の貴族を（　）に任命して国を治めさせ、地方の豪族を郡司に任命してそれぞれの地域を治めさせました。また、郡司の下には里長が置かれ、税の取り立てなどにあたりました。", "a": ["国司"], "lab": [""]}, {"n": 328, "t": "次の地図は、5世紀ごろの朝鮮半島の様子を表したものです。地図中の①〜③の国名を答えなさい。", "a": ["高句麗", "新羅", "百済"], "fig": "q328"}, {"n": 329, "t": "660年に百済が滅ぼされると、中大兄皇子は朝鮮半島へ軍を進めました。しかし、663年には唐と新羅の連合軍に（①）で敗れ、これにより日本は朝鮮半島での足場を失うことになりました。この戦いの後、皇子は北九州の（②）や瀬戸内海沿岸の守りを固めるとともに、都を近江国（滋賀県）の大津に移し、（③）天皇として即位しました。", "a": ["白村江の戦い", "大宰府", "天智"]}, {"n": 330, "t": "天智天皇の死後、672年には、その後継ぎをめぐって大海人皇子と大友皇子が争う（①）が起きました。この戦いに勝利した大海人皇子は（②）天皇として即位しました。（②）天皇の妻は、のちの（③）天皇です。（③）天皇は、694年に藤原京へ都を移しました。", "a": ["壬申の乱", "天武", "持統"]}, {"n": 331, "t": "7世紀の末には写真Aの（①）がつくられました。これは日本最古の貨幣といわれていますが、ほとんど流通しませんでした。708年には武蔵国（埼玉県）でとれた銅を使って写真Bの（②）がつくられました。", "a": ["富本銭", "和同開珎"], "fig": "q331"}, {"n": 332, "t": "701年には（①）と刑部親王が中心となり、唐の律令にならって（②）を制定しました。", "a": ["藤原不比等", "大宝律令"]}, {"n": 333, "t": "律令制の時代に人々にかけられた税についての次の説明を読んで、（①）〜（③）に当てはまる語句を答えなさい。<div class=\"box\">（①）…収穫した稲の3パーセントを納める税。<br>（②）…都で10日間働く代わりに布で納める税。<br>（③）…その地方の特産物を納める税。</div>", "a": ["租", "庸", "調"]}, {"n": 334, "t": "北九州を守る兵士を（①）といいます。また、国司の命令で1年に60日以内働くことを（②）といいます。", "a": ["防人", "雑徭"]}, {"n": 335, "t": "630年には、唐の進んだ文化を取り入れるため、（①）の派遣が始まりました。奈良時代に（①）として中国に渡った（②）は中国の皇帝に仕え高い位につきましたが、日本に帰ることはできずに亡くなりました。", "a": ["遣唐使", "阿倍仲麻呂"]}, {"n": 336, "t": "（①）天皇は、710年に都を（②）に移しました。", "a": ["元明", "平城京"]}, {"n": 337, "t": "現在の（①）市に設けられた平城京は、唐の都である（②）を手本としてつくられました。", "a": ["奈良", "長安"]}, {"n": 338, "t": "右の写真は奈良時代のころに使われていた、文字が書かれた木の札です。この札は各地方から都に運ばれてきた特産物の荷札としても使われました。この木の札を何といいますか。", "a": ["木簡"], "lab": [""], "fig": "q338", "figpos": "right"}, {"n": 339, "t": "奈良時代になると、重い税にたえられずに土地を捨てて逃げ出す農民が増える一方で、人口が増加し口分田が不足するようになったため、朝廷は723年に（①）を出し、田畑の開墾をうながしました。その後、743年に（②）が出され、開墾した土地の私有が認められるようになると、有力貴族や寺社は私有地を広げるようになっていきました。このような私有地を（③）といいます。これにより公地公民制がくずれ、日本の律令政治は衰え始めました。", "a": ["三世一身の法", "墾田永年私財法", "荘園"]}, {"n": 340, "t": "仏教をあつく信仰していた（①）天皇は、仏教の力で国を平和に治めるため、741年、全国に（②）・（③）をつくる命令を出し、その総本山として都に（④）を置きました。", "a": ["聖武", "国分寺", "国分尼寺", "東大寺"], "note": "※②・③は順不同"}, {"n": 341, "t": "仏教をあつく信仰し、悲田院や施薬院をつくり、貧しい人々を救ったといわれる、聖武天皇の皇后はだれですか。", "a": ["光明皇后（光明子）"], "lab": [""]}, {"n": 342, "t": "奈良時代に民衆に仏教を広め、橋をつくるなどの社会事業にも従事した僧として知られる（　）は、はじめは朝廷からの弾圧を受けましたが、のちに許され大仏づくりにも協力しました。", "a": ["行基"], "lab": [""]}, {"n": 343, "t": "① 奈良時代、正しい仏教のすがたを伝えるため、苦難の末に唐から来日した人物はだれですか。<br>② ①の人物が奈良の都につくった寺院の名前を答えなさい。", "a": ["鑑真", "唐招提寺"]}, {"n": 344, "t": "中国（唐）の影響を強く受けた奈良時代の仏教文化を（①）文化といいます。下の写真は聖武天皇の遺品が納められた（②）とよばれる建物で、大陸から日本にもたらされたさまざまな宝物が納められています。この建物は断面が三角形の材木をくみ上げてつくる（③）造という建築様式が特徴です。", "a": ["天平", "正倉院", "校倉"], "fig": "q344"}, {"n": 345, "t": "奈良時代には、天皇の権威を高めるために、古代の天皇の業績などを記した歴史書がつくられました。712年には太安万侶によって（①）が、720年には舎人親王によって（②）がつくられました。また、各地方の地理や特産物などを記した（③）もつくられました。", "a": ["古事記", "日本書紀", "風土記"]}, {"n": 346, "t": "奈良時代には現存する日本最古の歌集として知られる（①）がつくられました。（①）の中には、奈良時代の農民の苦しい生活の様子をあらわした、山上憶良の『（②）』が収められています。", "a": ["万葉集", "貧窮問答歌"]}, {"n": 347, "t": "（①）天皇は、律令政治を立て直すため、794年に都を（②）に移しました。", "a": ["桓武", "平安京"]}, {"n": 348, "t": "平安時代の初めに（①）に任じられた（②）は、東北地方の蝦夷と戦いました。", "a": ["征夷大将軍", "坂上田村麻呂"]}, {"n": 349, "t": "805年に唐から帰国した（①）は、（②）を開き、平安京の北東の（③）を総本山としました。", "a": ["最澄", "天台宗", "比叡山延暦寺"]}, {"n": 350, "t": "806年に唐から帰国した（①）は、（②）を開き、紀伊国（和歌山県）の（③）を総本山としました。", "a": ["空海", "真言宗", "高野山金剛峯寺"]}, {"n": 351, "t": "① 幼い天皇や女性の天皇に代わって政治をとり行う地位を何といいますか。<br>② 成人した男性の天皇に代わって政治を進める地位を何といいますか。", "a": ["摂政", "関白"]}, {"n": 352, "t": "一族で高位高官を独占し、大きな力をほこった藤原氏の政治を（①）政治といいます。866年には（②）が皇族（天皇の一族）以外では初めて摂政の座につきました。", "a": ["摂関", "藤原良房"]}, {"n": 353, "t": "（①）は、唐の衰えなどの理由から、天皇に（②）の中止を進言しました。これにより、894年、（②）は中止されることになりました。", "a": ["菅原道真", "遣唐使"]}, {"n": 354, "t": "935年、（①）は自ら「新皇」と名乗り、朝廷に対して大規模な反乱を起こしました。この反乱を（①）の乱といいます。この反乱は、下の地図中の（②）の地域で起こりました。", "a": ["平将門", "イ"], "fig": "q354"}, {"n": 355, "t": "939年、（①）は大宰府を攻撃し、都へ向けて軍を進めました。この反乱を（①）の乱といいます。この反乱は、上の地図中の（②）の地域で起こりました。", "talt": "939年、（①）は大宰府を攻撃し、都へ向けて軍を進めました。この反乱を（①）の乱といいます。この反乱は、下の地図中の（②）の地域で起こりました。", "figalt": "q354", "dep": 354, "a": ["藤原純友", "ウ"]}, {"n": 356, "t": "① 11世紀初めに摂政や太政大臣となり、「この世をば　我が世とぞ思ふ　望月の　欠けたることも　なしと思へば」という歌をよんだ人物はだれですか。<br>② ①の人物の息子で、藤原氏の全盛期を受け継いだ人物はだれですか。", "a": ["藤原道長", "藤原頼通"]}, {"n": 357, "t": "平安時代の中ごろになると、有力な貴族は荘園を広げ、特別な権利を持つようになりました。<br>① 税を納めなくてもよい権利を何といいますか。<br>② 荘園への役人の立ち入りを断る権利を何といいますか。", "a": ["不輸の権", "不入の権"]}, {"n": 358, "t": "平安時代になると、しだいに日本独自の貴族文化が成長するようになりました。これを（①）文化といいます。貴族は（②）造の屋敷に住み、貴族の女性たちは（③）という衣装をまとい、はなやかな生活を送りました。", "a": ["国風", "寝殿", "十二単"]}, {"n": 359, "t": "天皇の后となった藤原氏の娘に仕えた（①）は、平安時代の貴族社会の様子を『（②）』という物語に著しました。", "a": ["紫式部", "源氏物語"]}, {"n": 360, "t": "天皇の后となった藤原氏の娘に仕えた（①）は、貴族たちの日々の生活の様子を『（②）』という随筆に著しました。", "a": ["清少納言", "枕草子"]}, {"n": 361, "t": "① 平安時代に発達した、絵（大和絵）と物語（文章）を組み合わせた巻物を何といいますか。<br>② 平安時代につくられた、「かぐや姫」の伝説を題材とした物語を何といいますか。<br>③ 平安時代に、天皇の命令により紀貫之らが編者となってつくられた歌集を何といいますか。", "a": ["絵巻物", "竹取物語", "古今和歌集"]}, {"n": 362, "t": "① 浄土教を信仰した藤原頼通によってつくられた、右の写真の建物を何といいますか。<br>② この建物は、現在の何市につくられましたか。", "a": ["平等院鳳凰堂", "宇治市"], "fig": "q362", "figpos": "right"}, {"n": 363, "t": "（①）は、1086年に天皇の位を幼い息子にゆずり、上皇として政治を行うようになりました。これを（②）といいます。これにより、藤原氏による摂関政治は次第に衰えるようになりました。", "a": ["白河上皇", "院政"]}, {"n": 364, "t": "東北地方では、1051年から（①）合戦が、1083年から（②）合戦が起こりました。（②）合戦でかつやくした源義家を中心に、このころから東日本では（③）氏が力を強めるようになりました。", "a": ["前九年", "後三年", "源"]}, {"n": 365, "t": "364の戦乱の後、東北地方で勢力を強めた（①）氏は、現在の岩手県の（②）を本拠地として栄えました。（②）につくられた（③）は、堂の内部・外部ともに金箔がはられ、（①）氏の栄華の様子を伝えています。", "talt": "前九年合戦・後三年合戦の後、東北地方で勢力を強めた（①）氏は、現在の岩手県の（②）を本拠地として栄えました。（②）につくられた（③）は、堂の内部・外部ともに金箔がはられ、（①）氏の栄華の様子を伝えています。", "dep": 364, "a": ["奥州藤原", "平泉", "中尊寺金色堂"]}, {"n": 366, "t": "① 天皇と上皇の対立から1156年に京都で起こった戦乱を何といいますか。<br>② ①の戦乱の後、都で力を強めた源氏と平氏の対立から1159年に京都で起こった戦乱を何といいますか。<br>③ ①・②の戦乱に勝利し、1167年に武士として初めて太政大臣になった人物はだれですか。", "a": ["保元の乱", "平治の乱", "平清盛"]}, {"n": 367, "t": "右の写真の建物は、世界文化遺産に登録されています。平清盛が信仰したことでも知られるこの建物を何といいますか。", "a": ["厳島神社"], "lab": [""], "fig": "q367", "figpos": "right"}, {"n": 368, "t": "平清盛は、現在の神戸港にあたる（①）を整備し、中国との貿易をさかんに行いました。この貿易を（②）といい、中国からは（③）とよばれる貨幣が大量に輸入されました。", "a": ["大輪田泊", "日宋貿易", "宋銭"]}, {"n": 369, "t": "① 1185年に平氏が滅亡した戦いを何といいますか。<br>② ①の戦いが起こった場所を下の地図中のア〜オから選び、記号で答えなさい。", "a": ["壇ノ浦の戦い", "オ"], "fig": "q369"}];

const CIRC='①②③④⑤';

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function generate(){
  const cnt=Math.min(Q.length,Math.max(3,parseInt(document.getElementById('cnt').value)||15));
  const showAns=document.getElementById('withans').checked;

  let sel=shuffle(Q.slice()).slice(0,cnt);
  const nums=new Set(sel.map(q=>q.n));

  // 他の問題を参照する問題の処理
  // 参照先が出題されている → 原文のまま。参照先が直前に来るよう並べ替える
  // 参照先が出題されていない → 改変文（talt）と代替の図（figalt）を使う
  sel=sel.map(q=>{
    if(!q.dep) return q;
    if(nums.has(q.dep)) return Object.assign({},q,{_keepAfter:q.dep});
    return Object.assign({},q,{t:q.talt||q.t, fig:q.figalt||q.fig});
  });

  sel.forEach(q=>{
    if(!q._keepAfter) return;
    const from=sel.indexOf(q);
    sel.splice(from,1);
    const to=sel.findIndex(x=>x.n===q._keepAfter);
    sel.splice(to+1,0,q);
  });

  const c=document.getElementById('qc');
  c.innerHTML='';
  sel.forEach(q=>{
    const labs=q.lab||q.a.map((_,i)=>CIRC[i]);
    const ans=q.a.map((v,i)=>
      `<span class="ai">${labs[i]}<span class="al${showAns?' show':''}">${showAns?v:''}</span></span>`
    ).join('');

    let figR='', figB='';
    if(q.fig&&FIGS[q.fig]){
      const f=FIGS[q.fig];
      if(q.figpos==='right'){
        figR=`<span class="fig-r"><img src="${f.src}" style="max-height:${f.mh}mm"></span>`;
      }else{
        figB=`<div class="fig"><img src="${f.src}" style="max-height:${f.mh}mm"></div>`;
      }
    }
    const note=q.note?`<div class="note">${q.note}</div>`:'';

    const d=document.createElement('div');
    d.className='q';
    d.innerHTML=`<div class="q-body">${figR}<span class="q-num">${q.n}</span>${q.t}</div>`
              + figB + note
              + `<div class="ans">${ans}</div>`;
    c.appendChild(d);
  });

  document.getElementById('ctrl').style.display='none';
  document.getElementById('sheet').style.display='block';
  window.scrollTo(0,0);
}

function back(){
  document.getElementById('ctrl').style.display='block';
  document.getElementById('sheet').style.display='none';
}
